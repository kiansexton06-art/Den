<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Den - Llanishen High School</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="theme-light">
    <div class="background-overlay"></div>
    <header class="navbar">
        <div class="logo">
            <h1>The Den</h1>
            <p class="subtitle">Llanishen High School</p>
        </div>
        <div class="theme-switcher">
            <button class="theme-btn active" data-theme="theme-light">Light</button>
            <button class="theme-btn" data-theme="theme-dark">Dark</button>
            <button class="theme-btn" data-theme="theme-modern">Modern</button>
        </div>
    </header>

    <main class="container">
        <section class="card about-section">
            <h2>About Us</h2>
            <p class="cozy-text">We are a place where kids that need extra help can come to feel better!</p>
        </section>

        <section class="content-grid">
            <div class="card form-section">
                <h3>Share Your Work</h3>
                <p>What did you accomplish today?</p>
                <form id="workForm">
                    <div class="input-group">
                        <label for="studentName">Your Name</label>
                        <input type="text" id="studentName" placeholder="Enter your name..." required>
                    </div>
                    <div class="input-group">
                        <label for="studentWork">What did you do?</label>
                        <textarea id="studentWork" rows="4" placeholder="Tell us about the work you did..." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Post Work</button>
                </form>
            </div>

            <div class="card feed-section">
                <h3>Recent Work</h3>
                <div id="workFeed" class="feed-container">
                    <!-- Work items will appear here -->
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
